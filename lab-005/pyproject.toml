[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lab005-defocus-depth"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26,<3", "pillow>=10,<12", "opencv-python>=4.9,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests/python"]
