[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-measurement-lab-004"
version = "0.1.0"
description = "Local visual displacement and vibration measurement core"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==2.2.6",
  "opencv-python==4.12.0.88",
  "Pillow==11.3.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["camera_measurement*"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests/python"]
