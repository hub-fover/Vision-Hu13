<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测量工具 - 相机标定工具</title>
    <link rel="stylesheet" href="css/style.css?v=20260911-3">
</head>
<body class="measurement-page">
    <header>
        <div class="container">
            <h1>📏 测量工具</h1>
            <p class="subtitle">基于标定结果进行精确测量</p>
        </div>
    </header>

    <main class="container">
        <section class="measurement-workbench-section">
            <div class="card measurement-workbench-card">
                <div class="measurement-workbench-heading">
                    <div>
                        <h2>平面测量</h2>
                        <p>棋盘格与目标物体必须位于同一平面</p>
                    </div>
                    <div class="measurement-mode-selector" aria-label="测量模式">
                        <button type="button" class="measurement-mode-option active" id="distanceModeCard" onclick="selectMode('distance')">📏 两点距离</button>
                        <button type="button" class="measurement-mode-option" id="rectangleModeCard" onclick="selectMode('rectangle')">📐 矩形尺寸</button>
                    </div>
                </div>

                <div id="calibrationStatus" class="status-message status-info measurement-calibration-status">
                    正在检查标定数据...
                </div>

                <div class="measurement-workspace">
                    <div class="video-container measurement-video-container">
                        <video id="videoElement" autoplay playsinline></video>
                        <img id="sampleImageElement" alt="带有棋盘格的测量示例画面" hidden>
                        <canvas id="measureCanvas" class="canvas-overlay clickable"></canvas>
                        <div id="measurementMappingStatus" class="camera-detection-status" data-state="idle" role="status" aria-live="polite">
                            <span class="camera-detection-dot" aria-hidden="true"></span>
                            <span id="measurementMappingText">等待启动测量</span>
                        </div>
                    </div>

                    <aside class="measurement-control-panel">
                        <div class="measurement-source-controls">
                            <button id="startCamera" class="btn btn-primary">启动相机</button>
                            <button id="loadMeasurementSample" class="btn btn-secondary">加载测量示例</button>
                            <button id="clearPoints" class="btn btn-secondary" disabled>清除标记</button>
                            <button id="stopCamera" class="btn btn-danger" disabled>停止测量</button>
                        </div>

                        <div id="operationGuide" class="measurement-guide">
                            <h4 id="guideTitle">准备测量</h4>
                            <p id="guideText">启动相机或加载测量示例。</p>
                        </div>

                        <div class="measurement-result-panel" aria-live="polite">
                            <div class="measurement-result-heading">
                                <h3>测量结果</h3>
                                <button id="unitToggle" class="btn measurement-unit-toggle" onclick="toggleUnit()">单位: mm</button>
                            </div>
                            <div id="measurementResult" class="measurement-result-value">等待棋盘格检测</div>
                        </div>
                    </aside>
                </div>
            </div>
        </section>

        <!-- Measurement History -->
        <section>
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h2>测量历史</h2>
                    <button id="clearHistory" class="btn btn-danger" onclick="clearMeasurementHistory()">清空历史</button>
                </div>
                <ul id="historyList" class="history-list">
                    <li class="status-message status-info">暂无测量记录</li>
                </ul>
            </div>
        </section>

        <!-- Tips -->
        <section>
            <div class="tips-card">
                <h4>⚠️ 使用提示</h4>
                <ul>
                    <li>仅适用于<strong>平面物体</strong>的测量</li>
                    <li>物体应与标定板在<strong>同一平面</strong>上</li>
                    <li>保持相机<strong>稳定</strong>以获得准确结果</li>
                    <li>避免手抖影响精度，可使用支架固定</li>
                    <li>光线充足时测量效果更佳</li>
                </ul>
            </div>
        </section>

        <!-- Navigation -->
        <section>
            <div class="controls">
                <a href="index.html" class="btn btn-secondary">返回首页</a>
                <a href="calibration.html" class="btn btn-primary">重新标定</a>
                <a href="tutorial.html" class="btn btn-secondary">查看教程</a>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 相机标定工具 | 基于张正友标定法</p>
        </div>
    </footer>

    <script src="js/utils.js?v=20260910-3"></script>
    <script src="vendor/opencv.js?v=20260910-1" onload="onOpenCvReady()" onerror="onOpenCvError(new Error('无法加载同源 OpenCV.js'))"></script>
    <script src="js/measurement.js?v=20260911-1"></script>
</body>
</html>
