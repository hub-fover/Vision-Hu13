name: GitHub Pages

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == github.event.repository.default_branch && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out the revision validated by CI
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            lab-002/web/package-lock.json
            lab-003/web/package-lock.json
            lab-004/web/package-lock.json
            lab-005/web/package-lock.json

      - name: Install LAB 002 Web dependencies
        run: npm ci --prefix lab-002/web

      - name: Install LAB 003 Web dependencies
        run: npm ci --prefix lab-003/web

      - name: Install LAB 004 Web dependencies
        run: npm ci --prefix lab-004/web

      - name: Install LAB 005 Web dependencies
        run: npm ci --prefix lab-005/web

      - name: Download LAB 004 runtime validated by CI
        uses: actions/download-artifact@v4
        with:
          name: lab004-opencv-${{ github.event.workflow_run.head_sha }}
          path: lab-004/web/vendor
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download LAB 005 runtime validated by CI
        uses: actions/download-artifact@v4
        with:
          name: lab005-opencv-${{ github.event.workflow_run.head_sha }}
          path: lab-005/web/vendor
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage LAB 002 with its same-origin OpenCV runtime
        run: npm run build:lab002

      - name: Validate LAB 002 staged static resources
        run: npm run validate:lab002:pages

      - name: Stage LAB 003 with its same-origin OpenCV runtime
        run: npm run build:lab003

      - name: Validate LAB 003 staged static resources
        run: npm run validate:lab003:pages

      - name: Stage LAB 004 with the validated runtime
        run: npm run build:lab004

      - name: Validate LAB 004 staged static resources
        run: npm run validate:lab004:pages

      - name: Stage LAB 005 static application
        run: node lab-005/scripts/stage-pages.mjs

      - name: Validate LAB 005 staged static resources
        run: npm run validate:lab005:pages

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke-test deployed LAB entry points
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          for path in "" "lab-002/" "lab-003/" "lab-004/" "lab-005/" "lab-005/assets/samples/manifest.json" "lab-005/LICENSES.md" "lab-005/vendor/opencv.js"; do
            url="$base/$path"
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error --location --max-time 30 "$url" --output /dev/null; then
                break
              fi
              if [ "$attempt" -eq 6 ]; then
                echo "Deployed resource failed HTTP smoke test: $url" >&2
                exit 1
              fi
              sleep 10
            done
          done
