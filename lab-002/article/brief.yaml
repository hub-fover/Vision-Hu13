version: 1
audience:
  who: "想在手机或 Python 中理解并尝试基础全景拼接的计算机视觉初学者"
  context: "读者有一组按拍摄顺序排列、相邻画面存在重叠的现场照片"
  question: "几张有重叠的照片，怎样可靠地找出共同区域并合成一张可导出的全景图？"
goal:
  takeaway: "基础拼接可以记成两件事：先找到同一个地方，再决定谁覆盖谁。"
  action: "拍摄时保留稳定重叠和远景纹理，按顺序选图；失败时先看具体照片对、匹配数量与重投影诊断。"
thesis:
  statement: "一张可信的基础全景，不是把照片并排，而是先用特征和单应性建立共同坐标，再用曝光、羽化和安全裁剪处理覆盖关系。"
  novelty: "不把拼接包装成一键魔法，而是用真实帧和真实诊断把定位、筛选、对齐、融合及失败信号逐步对应起来。"
  boundary: "首版只处理相邻照片和平面单应性，不承诺解决近景视差、移动物体重影、360 度闭环或任意拍摄顺序。"
  counterpoint: "系统级相册常能直接生成全景，但它隐藏了失败发生在哪一对照片；本 LAB 的价值是可解释、可复现，而不是替代成熟相机应用。"
personal_materials:
  available: false
  items: []
framework: "观点"
sections:
  - purpose: "建立拼接的两阶段判断框架，并说明真实输入来源"
    claim_ids: [C1, C6]
  - purpose: "解释怎样找到同一个地方，以及匹配怎样被逐层筛掉"
    claim_ids: [C2]
  - purpose: "解释坐标累计、曝光、羽化和裁剪怎样决定覆盖关系"
    claim_ids: [C3]
  - purpose: "给出手机操作、隐私边界和拍摄入口的兼容条件"
    claim_ids: [C4, C5]
  - purpose: "用海面压力测试说明失败信号与首版边界"
    claim_ids: [C7, C8]
constraints:
  desired_length: "1200-2500 字"
  must_include:
    - "十张基于真实输入的算法标注图"
    - "三组 Pexels 实拍视频派生帧的就近署名"
    - "Pages 与源码入口"
    - "PENDING_DEVICE_CAPTURE 状态"
  must_avoid:
    - "虚构作者亲历、对话或现场细节"
    - "把第三方素材声明为原创或 CC BY 4.0"
    - "用模拟录屏或 Playwright 录像冒充真机素材"
    - "把未展示的近景视差或移动物体失败写成已有图像证据"
