[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "panorama-stitch-lab-002"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.9",
  "Pillow>=10",
]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
panorama_stitch = ["samples/mountains/*"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests/python"]
