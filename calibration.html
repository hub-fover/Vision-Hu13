<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相机标定 - 相机标定工具</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>📷 相机标定</h1>
            <p class="subtitle">使用棋盘格标定板标定你的相机</p>
        </div>
    </header>

    <main class="container">
        <section>
            <h2>步骤 1：配置参数</h2>
            <div class="controls">
                <div>
                    <label for="boardWidth">棋盘格宽度（内角点数）：</label>
                    <input type="number" id="boardWidth" value="8" min="4" max="20">
                </div>
                <div>
                    <label for="boardHeight">棋盘格高度（内角点数）：</label>
                    <input type="number" id="boardHeight" value="5" min="4" max="20">
                </div>
                <div>
                    <label for="squareSize">方格尺寸（毫米）：</label>
                    <input type="number" id="squareSize" value="25" min="1" max="100">
                </div>
            </div>
        </section>

        <section>
            <h2>步骤 2：采集图像</h2>
            <div class="video-container">
                <video id="videoElement" autoplay playsinline></video>
                <canvas id="overlayCanvas" class="canvas-overlay"></canvas>
            </div>
            <div class="controls">
                <button id="startCamera" class="btn btn-primary">启动相机</button>
                <button id="captureImage" class="btn btn-secondary" disabled>拍摄图像</button>
                <button id="stopCamera" class="btn btn-danger" disabled>关闭相机</button>
            </div>
            <div id="statusMessage"></div>
        </section>

        <section>
            <h2>已采集图像 (<span id="imageCount">0</span>/20)</h2>
            <div id="imageGrid" class="image-grid"></div>
            <div class="controls">
                <button id="clearImages" class="btn btn-danger">清空所有图像</button>
            </div>
        </section>

        <section>
            <h2>步骤 3：计算标定</h2>
            <div class="controls">
                <button id="calibrateButton" class="btn btn-primary" disabled>开始标定</button>
            </div>
            <div id="calibrationResult"></div>
        </section>

        <section>
            <div class="controls">
                <a href="index.html" class="btn btn-secondary">返回首页</a>
                <a href="measurement.html" class="btn btn-primary">进入测量</a>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 相机标定工具 | 基于 OpenCV.js 和张正友标定法</p>
        </div>
    </footer>

    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady()"></script>
    <script src="js/utils.js"></script>
    <script src="js/calibration.js"></script>
</body>
</html>
