<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f4f1">
  <title>LAB 003｜三次曝光合成</title>
  <meta name="description" content="手机拍暗、正常、亮三张，浏览器本地完成曝光融合。">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <a href="../" class="brand">VISION · HU13</a>
    <span>LAB 003</span>
  </header>

  <main>
    <section class="sample-stage" aria-labelledby="page-title">
      <img src="./assets/samples/peyrou/mean.jpg" alt="Peyrou 喷泉正常曝光样例" width="1200" height="800">
      <div class="sample-copy">
        <p class="lab-index">LOCAL PHOTO LAB · 003</p>
        <h1 id="page-title">一张照片装不下的明暗，怎样用三次曝光合成？</h1>
        <button id="sample-button" class="primary" type="button">用样例体验</button>
        <p id="sample-status" class="quiet" aria-live="polite"></p>
      </div>
    </section>

    <section class="workspace" aria-labelledby="capture-title">
      <div class="section-heading">
        <span>01</span>
        <div><h2 id="capture-title">准备三张照片</h2><p>保持构图不变，依次拍暗、正常、亮。</p></div>
      </div>

      <div id="capture-slots" class="capture-slots">
        <label class="capture-slot" data-slot="0">
          <input class="camera-input" type="file" accept="image/*" capture="environment" data-index="0">
          <span class="exposure-mark">偏暗</span><span class="slot-action">拍摄</span><img alt="" hidden>
        </label>
        <label class="capture-slot" data-slot="1">
          <input class="camera-input" type="file" accept="image/*" capture="environment" data-index="1">
          <span class="exposure-mark">正常</span><span class="slot-action">拍摄</span><img alt="" hidden>
        </label>
        <label class="capture-slot" data-slot="2">
          <input class="camera-input" type="file" accept="image/*" capture="environment" data-index="2">
          <span class="exposure-mark">偏亮</span><span class="slot-action">拍摄</span><img alt="" hidden>
        </label>
      </div>

      <div class="gallery-row">
        <label class="secondary"><input id="gallery-input" type="file" accept="image/jpeg,image/png,image/webp" multiple>从相册选择三张</label>
        <button id="reset-button" class="text-button" type="button">清空</button>
      </div>
      <div id="analysis-status" class="analysis-status" aria-live="polite">等待三张照片</div>
      <p id="error-message" class="error" role="alert" hidden></p>
      <button id="run-button" class="primary full" type="button" disabled>开始融合</button>
    </section>

    <section id="progress-panel" class="progress-band" hidden aria-live="polite">
      <div><strong id="progress-stage">准备中</strong><span id="progress-percent">0%</span></div>
      <progress id="progress" max="1" value="0"></progress>
      <button id="cancel-button" class="text-button" type="button">取消</button>
    </section>

    <section id="result-panel" class="result-section" hidden aria-labelledby="result-title">
      <div class="section-heading"><span>02</span><div><h2 id="result-title">融合完成</h2><p id="result-summary"></p></div></div>
      <div class="view-tabs" role="tablist" aria-label="结果视图">
        <button type="button" class="active" data-view="fusion">融合结果</button>
        <button type="button" data-view="middle">中间曝光</button>
        <button type="button" data-view="motion">运动区域</button>
      </div>
      <div class="result-frame">
        <img id="result-preview" alt="曝光融合结果">
        <div id="compare-layer" class="compare-layer"><img id="middle-preview" alt="中间曝光"></div>
      </div>
      <label class="compare-control" for="compare-range">前后比较<input id="compare-range" type="range" min="0" max="100" value="50"></label>
      <div class="result-actions">
        <button id="download-button" class="primary" type="button">下载 JPEG</button>
        <button id="share-button" class="secondary" type="button">系统分享</button>
        <button id="again-button" class="text-button" type="button">重新拍摄</button>
      </div>
      <p id="share-status" class="quiet" aria-live="polite"></p>
    </section>

    <section class="boundary-band">
      <p>这是曝光融合，不是绝对 HDR。运动保护只能减少重影，不能恢复被遮挡的内容。</p>
    </section>
  </main>
  <footer><span>照片只在当前页面内处理</span><a href="../README.md">源码与说明</a></footer>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
