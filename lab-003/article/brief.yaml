title: "LAB 003｜一张照片装不下的明暗，怎样用三次曝光合成？"
subtitle: "不用专业模式：手机拍暗、正常、亮三张，网页本地合成曝光融合"
audience: "对手机摄影和计算机视觉好奇，但不熟悉 HDR 术语的普通读者"
goal: "让读者用三张普通 JPEG 完成本地曝光融合，并理解对齐、质量权重、金字塔和运动保护的作用与边界"
reading_minutes: 8
tone: "低门槛、具体、克制"
primary_action: "打开网页并点击“用样例体验”"
constraints:
  - "不要求第三方相机 App"
  - "不要求精确 EV"
  - "不承诺完整去鬼影"
  - "不把曝光融合称为绝对 HDR 辐亮度恢复"
  - "不把教学实现类比为厂商内部管线"
