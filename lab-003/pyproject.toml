[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "exposure-fusion-lab-003"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==2.2.6",
  "opencv-python==4.12.0.88",
  "Pillow==11.3.0"
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "pypdf==6.10.0"]
publication = ["reportlab==4.4.9", "pypdf==6.10.0"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
exposure_fusion = ["samples/peyrou/*"]

[tool.pytest.ini_options]
pythonpath = [".", "python"]
testpaths = ["tests/python"]
